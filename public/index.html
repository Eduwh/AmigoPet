<script>
(() => {

  const titles = {overview:'Bom dia, Amanda!',agenda:'Agenda do petshop',clients:'Clientes e seus pets',client:'Ana Souza',rafael:'Rafael Lima',pets:'Pets e seus tutores',pet:'Ficha da Mel',vaccines:'Controle de vacinas',grooming:'Banho e tosa',booking:'Novo agendamento',confirmed:'Agendamento confirmado','agenda-confirmed':'Agenda atualizada',registration:'Cadastro e vínculos',dose:'Registrar vacina','dose-confirmed':'Carteira atualizada','pet-updated':'Ficha da Mel'};
  const go = (key,label,cls='button') => `<a class="${cls}" href="#${key}">${label}</a>`;
  const tag = (label,tone='teal') => `<span class="tag ${tone}">${label}</span>`;
  const card = (title,body) => `<section class="m-card">${title?`<h2>${title}</h2>`:''}${body}</section>`;
  const pair = (label,value) => `<div class="m-pair"><dt>${label}</dt><dd>${value}</dd></div>`;
  const note = label => `<p class="m-note">${label}</p>`;
  const pet = (name,detail,owners,action=false) => `<div class="m-record"><div class="m-avatar" aria-hidden="true">${name.slice(0,1)}</div><div class="m-grow"><h3>${name}</h3><p>${detail}</p><p>${owners}</p>${action?go('pet','Abrir ficha da Mel →','text-link'):''}</div></div>`;
  const field = (label,value) => `<label class="m-field"><span>${label}</span><input value="${value}" readonly aria-readonly="true"></label>`;
  const visit = (time,name,service,owner,status='Confirmado') => `<article class="m-visit"><div class="m-row"><strong>${time}</strong>${tag(status,status==='Aguardando'?'orange':'teal')}</div><h3>${name}</h3><p>${service}</p><p>${owner}</p>${name==='Mel'?go('pet','Ficha e cuidados →','text-link'):''}</article>`;
  function render(key) {
    const updated=key==='pet-updated';
    switch(key){
      case 'overview':return `<p class="m-intro">Segunda, 19 de outubro. Vamos cuidar de bons amigos hoje?</p><div class="m-stats">${[['12','Atendimentos hoje'],['128','Clientes'],['176','Pets cadastrados'],['3','Vacinas a acompanhar']].map(([n,s])=>`<div><strong>${n}</strong><span>${s}</span></div>`).join('')}</div>${go('booking','+ Novo agendamento')}${card('Próximos atendimentos',visit('09:00','Mel','Banho + tosa higiênica','Ana Souza + Rafael Lima','Em atendimento')+visit('10:00','Thor','Banho e hidratação','Pedro Alves')+go('agenda','Ver toda a agenda →','text-link'))}${card('Atenção com carinho',tag('Vacina da Mel em atraso','red')+note('Conferir a carteira com a tutora.')+go('vaccines','Acompanhar vacinas →','text-link'))}${card('Uma ficha. Todos os cuidados.',note('Clientes, responsáveis, vacinas e histórico do pet conectados.')+go('pets','Conhecer as fichas','button secondary'))}`;
      case 'clients':return `<p class="m-intro">Contatos e pets de cada família, sempre por perto.</p>${go('registration','+ Cadastrar cliente')}${card('Clientes cadastrados',[['Ana Souza','Mel e Luna','client'],['Rafael Lima','Mel · cotutor','rafael'],['Pedro Alves','Thor',null],['Beatriz Costa','Nina e Chico',null],['Carlos Martins','Bento',null]].map(([n,p,k])=>`<div class="m-list-item"><h3>${n}</h3><p>${p}</p>${k?go(k,'Abrir cadastro →','text-link'):''}</div>`).join(''))}${note('O mesmo pet pode ter vários tutores sem duplicar a ficha.')}`;
      case 'client':case 'rafael':{const r=key==='rafael';return card('Contato',`<div class="m-record"><div class="m-avatar">${r?'RL':'AS'}</div><h3>${r?'Rafael Lima':'Ana Souza'}</h3></div><dl>${pair('Telefone',r?'(47) 90000-0102':'(47) 90000-0101')}${pair('Endereço','Bombinhas · SC')}${pair('Vínculo com a Mel',r?'Cotutor · retirada autorizada':'Tutora · contato preferencial')}</dl>`)+card('Pets vinculados',pet('Mel','Shih-tzu · 4 anos',r?'Também vinculada a Ana Souza':'Também vinculada a Rafael Lima',true)+(r?'':pet('Luna','SRD · 2 anos','Ana é a única tutora vinculada')))+go('registration','Vincular outro pet','button secondary');}
      case 'pets':return `<p class="m-intro">Uma ficha por pet, mesmo com vários tutores.</p>${go('registration','+ Cadastrar ou vincular')}${card('Pets cadastrados',pet('Mel','Shih-tzu · pequeno porte','Ana Souza + Rafael Lima · 2 tutores',true)+pet('Luna','Gata · pequeno porte','Ana Souza')+pet('Thor','Cão · grande porte','Pedro Alves')+pet('Nina','Cão · pequeno porte','Beatriz Costa')+pet('Bento','Cão · médio porte','Carlos Martins'))}`;
      case 'pet':case 'pet-updated':return card('',pet('Mel','Shih-tzu · fêmea · 4 anos','6,2 kg · pequeno porte')+tag('Pele sensível','orange')+note('Usar shampoo informado na ficha. Secador em temperatura baixa.'))+card('Tutores e responsáveis',`<div class="m-list-item"><h3>Ana Souza</h3><p>Contato preferencial · (47) 90000-0101</p>${go('client','Ver cadastro →','text-link')}</div><div class="m-list-item"><h3>Rafael Lima</h3><p>Cotutor · retirada autorizada · (47) 90000-0102</p>${go('rafael','Ver cadastro →','text-link')}</div>${go('registration','Gerenciar vínculos','button secondary')}`)+card('Carteira de vacinação',tag(updated?'Antirrábica registrada':'Antirrábica · data em atraso',updated?'teal':'red')+note(updated?'Próxima data informada: 19 out. 2027':'Data prevista na carteira: 16 out. 2026')+note('V10 · próxima data: 23 out. 2026')+go(updated?'dose-confirmed':'vaccines','Ver carteira →','text-link'))+card('Histórico de banho e tosa',`<div class="m-list-item"><h3>16 out. 2026 · Júlia</h3><p>Banho + tosa higiênica</p><p>Lâmina 4 no corpo; manter franja.</p></div><div class="m-list-item"><h3>02 out. 2026 · Júlia</h3><p>Banho + hidratação</p><p>Sem irritação observada após o banho.</p></div>`)+go('booking','Agendar para a Mel');
      case 'vaccines':return `<p class="m-intro">Datas da carteira e próximas doses informadas pelo veterinário.</p><div class="m-stats"><div><strong>01</strong><span>Em atraso</span></div><div><strong>02</strong><span>Próximos 7 dias</span></div></div>${go('dose','+ Registrar dose')}${card('Mel · antirrábica',tag('Data em atraso','red')+note('Data prevista: 16 out. 2026')+note('Tutores: Ana Souza e Rafael Lima')+go('pet','Abrir ficha da Mel →','text-link'))}${card('Mel · V10',tag('Próxima dose','orange')+note('Próxima data: 23 out. 2026'))}${card('Thor · antirrábica',tag('Próxima dose','orange')+note('Próxima data: 24 out. 2026'))}${note('O mockup acompanha registros. Não calcula protocolos de vacinação.')}`;
      case 'agenda':case 'agenda-confirmed':return `<p class="m-intro">Segunda-feira, 19 de outubro de 2026</p>${key==='agenda-confirmed'?card('Novo horário incluído',tag('Agendamento demonstrativo')+note('Mel · 15:00–16:00 · Júlia')):''}${go('booking','+ Novo agendamento')}${card('Manhã',visit('09:00–10:00','Mel','Banho + tosa higiênica · Júlia','Ana Souza + Rafael Lima','Em atendimento')+visit('10:00–11:00','Thor','Banho e hidratação · Bruno','Pedro Alves')+visit('10:30–11:30','Luna','Tosa na tesoura · Júlia','Ana Souza','Aguardando'))}${card('Tarde',note('12:00–13:00 · intervalo da equipe')+visit('13:00–14:00','Nina','Banho e escovação · Bruno','Beatriz Costa')+(key==='agenda-confirmed'?visit('15:00–16:00','Mel','Banho + tosa higiênica · Júlia','Ana Souza','Novo agendamento'):''))}${go('grooming','Ver fila de atendimento','button secondary')}`;
      case 'grooming':return `<p class="m-intro">Do check-in à entrega, cada cuidado tem sua etapa.</p>${card('Aguardando · 2',visit('10:00 · Bruno','Thor','Banho + hidratação','Pele sensível. Usar produto da ficha.','Aguardando')+visit('10:30 · Júlia','Luna','Tosa na tesoura','Manter comprimento das orelhas.','Aguardando'))}${card('Em atendimento · 2',visit('09:00 · Júlia','Mel','Banho + tosa higiênica','Secador em temperatura baixa.','Em atendimento')+visit('09:30 · Bruno','Nina','Banho + escovação','Cuidado na escovação das patas.','Em atendimento'))}${card('Pronto para retirada · 1',visit('08:00 · Júlia','Bento','Banho completo','Entrega ao tutor cadastrado.','Pronto'))}${note('As etapas são ilustrativas neste mockup.')}`;
      case 'booking':return `<p class="m-intro">Exemplo preenchido. Os campos são ilustrativos.</p>${card('Um cuidado marcado',field('Pet','Mel · Shih-tzu · #PET-014')+note('Tutores vinculados: Ana Souza e Rafael Lima')+field('Responsável pelo agendamento','Ana Souza · contato preferencial')+field('Serviço','Banho + tosa higiênica')+field('Data','19/10/2026')+field('Horário','15:00–16:00')+field('Profissional','Júlia · banho e tosa'))}${card('Antes de receber a Mel',tag('Pele sensível','orange')+note('Usar shampoo informado na ficha. Secador em temperatura baixa.')+note('Retirada autorizada: Ana Souza ou Rafael Lima.'))}${go('confirmed','Confirmar agendamento de exemplo')}${go('agenda','Cancelar','button secondary')}`;

      case 'registration':return `<p class="m-intro">Uma pessoa por cadastro. Vários tutores por pet.</p>${card('Dados do cliente',field('Nome completo','Rafael Lima')+field('Telefone','(47) 90000-0102')+field('E-mail opcional','rafael@example.com')+field('Endereço','Bombinhas · SC'))}${card('Vincular pet existente',tag('Cotutor da Mel')+field('Pet já cadastrado','Mel · #PET-014 · tutora Ana Souza')+note('Ana continua vinculada. A carteira e o histórico são os mesmos.')+`<ul class="m-checks"><li>Pode retirar o pet</li><li>Recebe avisos de atendimento</li></ul>`+note('Contato preferencial: Ana Souza.'))}${go('pet','Ver vínculo de exemplo')}${go('clients','Voltar aos clientes','button secondary')}`;
      case 'dose':return `<p class="m-intro">Transcrição de exemplo de uma carteira. Campos ilustrativos.</p>${card('Registro da Mel',field('Vacina','Antirrábica')+field('Data da aplicação','19/10/2026')+field('Lote','EXEMPLO-001')+field('Profissional / registro','Conforme comprovante')+field('Próxima data informada pelo veterinário','19/10/2027')+field('Origem','Carteira apresentada pelo tutor'))}${note('Este exemplo não grava dados ou recomenda um protocolo.')}${go('dose-confirmed','Ver carteira atualizada de exemplo')}${go('vaccines','Voltar','button secondary')}`;
      case 'dose-confirmed':return card('Dose registrada · exemplo',tag('Antirrábica registrada')+`<dl>${pair('Pet','Mel · Ana Souza e Rafael Lima')}${pair('Aplicação','19 out. 2026')}${pair('Próxima data informada','19 out. 2027')}${pair('Lote','EXEMPLO-001')}${pair('Profissional','Conforme comprovante')}${pair('Origem','Carteira apresentada pelo tutor')}</dl>`)+go('pet-updated','Ver ficha atualizada')+go('vaccines','Voltar ao acompanhamento','button secondary');

    }
  }
  function showMobile(){
    const raw=location.hash.slice(1)||'overview';const key=aliases[raw]||raw;
    if(!mq.matches){app.hidden=true;return;}
    app.hidden=false;
    const active=['clients','client','rafael','registration'].includes(key)?'clients':['pet','pets','pet-updated'].includes(key)?'pets':['dose','dose-confirmed','vaccines'].includes(key)?'vaccines':['booking','confirmed','agenda-confirmed','agenda'].includes(key)?'agenda':key;
    app.innerHTML=`<div class="m-brand"><a href="#overview">🐾 <strong>AmigoPet</strong></a><span>Gestão com carinho</span></div><div class="m-content"><h1>${titles[key]||titles.overview}</h1>${render(Object.prototype.hasOwnProperty.call(titles,key)?key:'overview')}<p class="m-disclaimer">Mockup de apresentação · dados fictícios.<br>Sem gravação de dados ou envio de mensagens.</p></div><nav class="m-bottom" aria-label="Menu do petshop">${[['overview','Início'],['agenda','Agenda'],['clients','Clientes'],['pets','Pets'],['vaccines','Vacinas'],['grooming','Banho e tosa']].map(([k,t])=>go(k,t,active===k?'active':'')).join('')}</nav>`;
    app.querySelectorAll('a').forEach(a=>{if(a.hash===`#${active}`&&a.closest('nav'))a.setAttribute('aria-current','page');});
  }
  window.addEventListener('hashchange',showMobile);
  mq.addEventListener('change',showMobile);
  showMobile();
})();

</script>
